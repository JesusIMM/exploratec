<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Control Remoto</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- SDKs de Firebase (Versión 8 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <div class="container">
    <h1>Control de Luz Remoto</h1>
    
    <button id="btn-luz" class="btn">Cargando...</button>
    <br><br>
    <button id="btn-intermitente" class="btn btn-warning">Modo Intermitente</button>
    <br><br>
    
    <!-- Nuevo botón y panel de historial -->
    <button id="btn-toggle-historial" class="btn btn-secondary">Ver Historial ⬇</button>
    
    <div id="panel-historial" class="panel oculto">
      <h3>Últimos movimientos</h3>
      <ul id="lista-historial">
        <!-- Los registros aparecerán aquí automáticamente -->
      </ul>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
